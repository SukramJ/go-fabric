name: Dependabot auto-merge

# Queues Dependabot's minor and patch PRs for auto-merge. Nothing merges
# until branch protection is satisfied, so its required checks
# (script/requiredchecks/required.txt, twenty on 2026-11-13) still decide —
# this only removes the click.
#
# Major bumps are excluded on purpose. Two of this module's direct requires
# carry the licence position recorded in THIRD-PARTY-NOTICES.md, and a
# relicensing dependency arrives as a version number like any other; a major
# bump is a decision a person makes.
#
# The rule fails closed (review II, R2-P5-sup-08): only an update type
# fetch-metadata names as minor or patch is queued — an empty or unknown
# one is not — and only for a pull request Dependabot opened, read from the
# pull request's author rather than from whoever triggered the event. The
# workflow checks out nothing and runs no code of the pull request.
#
# A merge by this workflow is made with the GitHub Actions token, and such a
# push starts no workflow: main gets no push run of ci for it (61a14ef5).
# The pull request's own runs are what the branch protection read; a
# release tag needs a commit with a ci run whose required checks passed
# (script/release-provenance.sh), so such a commit is not tagged as is.

# yamllint disable-line rule:truthy
on: pull_request_target

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
      - name: Enable auto-merge for minor and patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
