name: codeql

# CodeQL static analysis (SAST): data-flow and taint analysis over the Go
# source — injection, crypto misuse, unchecked bounds on decoded input.
# Findings surface in the repository's Security → Code scanning tab; the job
# does not fail on alerts, and it is not one of the checks branch protection
# requires. That is deliberate: this module parses attacker-supplied wire
# bytes (TLV, the Interaction Model, PASE/CASE), which is exactly the shape
# that produces true positives worth reading and false positives worth
# dismissing by hand — neither belongs on the merge path.
#
# It complements, rather than duplicates, the other two security legs:
# `make vuln` (nightly) asks whether a known advisory is reachable, and
# gosec inside golangci-lint pattern-matches single functions. CodeQL is the
# only one that follows a value across package boundaries.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1" # weekly Monday 03:23 UTC

permissions:
  contents: read
  security-events: write # required to upload CodeQL results

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.26.6"

jobs:
  analyze:
    name: codeql (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          # Go's CodeQL extractor requires a real compile (build-mode: none is
          # rejected for Go). autobuild runs `go build ./...`, which is the
          # whole build for a library module with no generated inputs — the
          # same command the ci `build` job runs.
          build-mode: autobuild
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:go"
