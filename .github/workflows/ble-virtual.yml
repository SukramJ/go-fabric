# BLE end to end over virtual HCI controllers (ADR 0024 decision 5): two
# btvirt controllers on the runner's BlueZ, connectedhomeip's
# chip-all-clusters-app from the pinned CHIP image (CHIP_TEST_IMAGE in the
# Makefile) advertising on one, the reference controller's BLE build
# (ble/bluez/cmd/reference-controller) pairing it over the other with
# `pair --ble`, then a read over CASE.
#
# Manual only (owner decision 2026-10-18): btvirt needs root and the
# kernel's vhci module, and a GitHub-hosted runner is the one place both
# are at hand. The steps are script/ble-virtual-test.sh, the same as
# `make ble-virtual-test` locally.
#
# The summary separates the ENVIRONMENT (btvirt, BlueZ, the vhci module,
# the image, an app built without BLE) from a DEFECT (the build, the
# pairing, the read), as the chip-tool control leg does for the harness.
# Both fail the job: an environment verdict proves nothing about go-fabric,
# and a green run must mean the pairing happened.
name: ble-virtual

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.2"

jobs:
  ble-virtual:
    name: BLE over btvirt (all-clusters app, pair --ble)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            ble/bluez/go.sum
      - name: install BlueZ, its test tools and avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bluez bluez-tests avahi-daemon
          # As the chip-tool jobs: avahi only on the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          bluetoothctl --version
      - name: pair over btvirt
        env:
          BLE_LOG_DIR: ${{ runner.temp }}/ble-virtual
        run: make ble-virtual-test
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ble-virtual-logs
          path: ${{ runner.temp }}/ble-virtual
          if-no-files-found: ignore
