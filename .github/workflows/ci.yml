name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.3"
  # The lint tools are pinned on purpose, and pinned to the same versions
  # the reference daemon uses. A new lint release adds checks that are style
  # decisions, and floating on @latest makes this gate report on the calendar
  # rather than on the diff — main goes from green to red overnight on an
  # unchanged tree.
  #
  # Bump deliberately: raise the version here, run the linter locally, and fix
  # or justify whatever the new release finds in the same change. The gofumpt
  # step below runs the standalone formatter, which is stricter than the one
  # golangci-lint bundles, so check `gofumpt -l .` against GOFUMPT_VERSION too.
  GOFUMPT_VERSION: "v0.12.0"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # This module is a library — there is no binary to smoke-test, so
      # compiling the whole package graph is the whole of the build leg.
      - name: go build
        run: make build

  build-32bit:
    name: build (32-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # An int is 32 bits on arm and 386, so an untyped constant past
      # math.MaxInt32 that converts to int compiles on amd64 and fails here
      # (#225). The armv7 build is the consumer's cross-compile; vet on 386
      # type-checks the test files too.
      - name: go build (linux/armv7), go vet (linux/386)
        run: make build-32bit
  apidiff:
    name: apidiff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The guard compares with the last tag: the full history and the
          # tags, not the shallow checkout.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # A break is announced before it ships (README, How a consumer
      # learns about a break): every incompatible change against the last
      # tag must be named under [Unreleased]. On the tag itself there is
      # nothing to compare.
      - name: apidiff against the last tag
        run: make apidiff-check

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Overlaps with the govet linter in the lint job, but runs even when a
      # lint failure elsewhere in the config stops that job early, and vets
      # the test files' build graph as the toolchain sees it.
      - name: go vet
        run: make vet

  test:
    name: test (linux, race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The race detector is not optional for this module: it is a protocol
      # stack whose session, subscription and MRP paths are concurrent by
      # construction, and a data race there surfaces as an intermittent
      # pairing failure in a controller nobody can attach a debugger to.
      # -race requires cgo, so this one step overrides the module-wide
      # CGO_ENABLED=0.
      - name: go test (race)
        env:
          CGO_ENABLED: "1"
        run: make race

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Per-package statement coverage against the floors in
      # script/coverfloor/floors.go. Per package rather than one module-wide
      # number on purpose: a single total hides a package losing fifteen
      # points behind every other package's statements, and that drift is the
      # only thing a coverage gate on an already well-tested module can
      # usefully detect.
      #
      # It runs the suite a second time (the test job runs it under -race,
      # which cannot also carry the coverage instrumentation this reads), so
      # it is its own job rather than a step appended to that one.
      - name: coverage floor
        run: make cover-check

  bench:
    name: bench (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Ten iterations per benchmark: this leg measures nothing — a shared
      # runner's numbers are not comparable between runs — it proves the
      # benchmarks still build, still find their fixtures and still complete.
      # Without it a benchmark rots unnoticed until the day somebody needs a
      # number from it, which is the day they least want to debug a fixture.
      - name: go test -bench
        run: make bench-smoke

  reachability:
    name: reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Regenerates the inventory and fails on the two things a committed
      # snapshot cannot catch by itself: a snapshot that no longer matches the
      # tree, and an unreached-export count off its ratchet.
      #
      # The root set is this module's own tests. go-fabric is a library with no
      # cmd/ tree, so there is no production entry point to seed from, and a
      # production-only run would start from nothing and report the entire
      # exported surface as dead. The question this leg answers instead is
      # "which exported API does no test reach" — for a module built to be
      # consumed from outside, that is the surface a host can break without
      # anything here noticing.
      - name: reachability
        run: make reachability-check
      # What a controller sees of the reference daemon (--dump-surface,
      # ADR 0030): every change of it is a review diff in the pull request.
      - name: surface
        run: make surface-check

  testparity:
    name: testparity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Holds the matter.js test-porting register (script/testparity) against
      # the committed snapshot of matter.js's test files at the schema pin: no
      # file without an entry, no entry without a file, every Go test an entry
      # names exists, a ported, partial or excluded verdict was checked against
      # the blob now pinned, the rendered page is current, and the planned count sits
      # exactly on its ratchet. No matter.js clone: the snapshot is committed.
      - name: testparity
        run: make testparity-check

  cite-check:
    name: matter.js citations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # script/citecheck (concept v4 §A.2) checks every `<file>.ts:<line>`
      # the Go code cites against matter.js at the pin, parity/schema.json →
      # matter.sourceCommit, and fails on a hard error (a file that does not
      # resolve, a line beyond its end) and on a drift list that moved off the
      # committed script/citecheck/drift.json.
      #
      # It is on the merge path although it needs the network, for the same
      # reason the chipdm job is: the commit is fixed, so the content it reads
      # is deterministic, and a citation that went stale is a defect of this
      # change, not of the environment. A clone that fails leaves the check
      # without its tree; citecheck then exits 2 and the job is red — a check
      # that did not run was not green.
      #
      # A blob-filtered clone without checkout, sparse on the three source
      # roots citecheck reads (examples, packages, support): the trees of the
      # whole history (for a citation's own `at <sha>`), the blobs of the pin.
      - name: clone matter.js at the pin
        env:
          MATTERJS_DIR: ${{ runner.temp }}/matter.js
        run: |
          PIN=$(sed -n 's/^ *"sourceCommit": *"\([0-9a-f]*\)".*/\1/p' parity/schema.json | head -1)
          test -n "$PIN"
          git clone -q --filter=blob:none --no-checkout https://github.com/matter-js/matter.js.git "$MATTERJS_DIR"
          git -C "$MATTERJS_DIR" sparse-checkout set examples packages support
          git -C "$MATTERJS_DIR" -c advice.detachedHead=false checkout -q "$PIN"
      - name: cite-check
        run: make cite-check MATTERJS_DIR="${{ runner.temp }}/matter.js"

  chipdm:
    name: chip data model cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The cross-check (internal/chipdm, ADR 0015) reads connectedhomeip's
      # data_model/<version> XML at test time; nothing derived from it is
      # committed, because the files' CSA notice forbids publishing them or
      # deriving works from them. Every other job sees no checkout and the
      # cross-check skips there; this one provides it and runs the check with
      # GOFABRIC_CHIP_REQUIRED=1 (make chipdm-check), so a skip is a failure
      # and the comparison cannot rot unnoticed.
      - name: read the CHIP pins
        id: pins
        run: |
          echo "commit=$(sed -n 's/^CHIP_TEST_IMAGE_COMMIT *?= *//p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^CHIP_DATA_MODEL_VERSION *?= *//p' Makefile)" >> "$GITHUB_OUTPUT"
          echo "levels=$(sed -n 's/^CHIP_LEVEL_DATA_MODELS *?= *//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: cache the CHIP data model checkout
        id: chip-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/connectedhomeip
          key: chipdm-${{ steps.pins.outputs.commit }}-${{ steps.pins.outputs.version }}-${{ steps.pins.outputs.levels }}
      # A blob-filtered, depth-1 partial clone of the pinned commit with only
      # data_model/<version> and the specification levels' directories
      # (CHIP_LEVEL_DATA_MODELS, the level cross-check) checked out: a few MB,
      # no authentication. The same fetch script/chiptool-setup.sh makes,
      # with a narrower sparse set.
      - name: fetch connectedhomeip data_model at the pin
        if: steps.chip-cache.outputs.cache-hit != 'true'
        env:
          CHIP_DIR: ${{ runner.temp }}/connectedhomeip
          PIN: ${{ steps.pins.outputs.commit }}
          DM: data_model/${{ steps.pins.outputs.version }}
          LEVELS: ${{ steps.pins.outputs.levels }}
        run: |
          dirs="$DM"
          for l in $LEVELS; do dirs="$dirs data_model/$l"; done
          git init -q "$CHIP_DIR"
          git -C "$CHIP_DIR" remote add origin https://github.com/project-chip/connectedhomeip.git
          # shellcheck disable=SC2086 # one directory per word
          git -C "$CHIP_DIR" sparse-checkout set --cone $dirs
          git -C "$CHIP_DIR" fetch -q --depth 1 --filter=blob:none origin "$PIN"
          git -C "$CHIP_DIR" -c advice.detachedHead=false checkout -q FETCH_HEAD
          du -sh "$CHIP_DIR"
      - name: cross-check
        run: make chipdm-check CHIP_ROOT="${{ runner.temp }}/connectedhomeip"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install pinned lint tooling
        run: go install mvdan.cc/gofumpt@${{ env.GOFUMPT_VERSION }}
      # Install golangci-lint v2 from source with the Go toolchain set up
      # above. The prebuilt binary ships built with an older Go and refuses
      # to run against a module targeting a newer one; golangci-lint-action@v6
      # installs a v1 binary that rejects this repo's v2 config
      # (version/formatters/linters.default keys). A direct `go install` of
      # the /v2/ module avoids both problems.
      - name: golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      # make lint runs the same gofumpt check, config verify, linter run and
      # module-hygiene steps a contributor gets locally, so the two cannot
      # drift apart. The versions above are the ones the Makefile pins.
      # make lint also fails on go.mod/go.sum drift from `go mod tidy` and
      # on a go.sum checksum that does not match the module cache.
      - name: lint
        run: make lint

  bluez:
    name: ble/bluez
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            ble/bluez/go.sum
      - name: golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      # ble/bluez is a module of its own (ADR 0024 decision 3), so no other
      # job's ./... reaches it: build (Linux and the !linux stub), vet, test,
      # lint and module hygiene inside it. Its tests run over an in-process
      # bus; the live path over btvirt is ble-virtual.yml's.
      - name: ble/bluez
        run: make bluez-check

  esphome:
    name: ble/esphome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            ble/esphome/go.sum
      - name: golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}
      # ble/esphome is a module of its own (ADR 0024 decision 3), so no other
      # job's ./... reaches it: build (Linux, darwin, windows), vet, the tests
      # under the race detector against the in-process fake proxy, lint and
      # module hygiene inside it.
      - name: ble/esphome
        run: make esphome-check
