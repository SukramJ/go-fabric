name: pages

# The documentation site (mkdocs.yml). A pull request that touches it is
# built with --strict, which is the link check: a broken link, a missing
# nav target or a quickstart snippet that moved fails the build. Publishing
# is not done here: thingfabric/docs (its publish.yml) builds this
# repository's main once an hour when it moved and deploys it to
# docs.thingfabric.dev, so this repository carries no Pages deployment and
# no credential (owner decision of 2026-11-22, the move to thingfabric).
on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "script/mkdocs/**"
      - "examples/quickstart-device/main.go"
      - "examples/quickstart-controller/main.go"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: install
        # The hashed lock of docs/requirements.in (R2-P5-sup-07): every
        # package of the set pinned, none installed without its hash.
        run: pip install --require-hashes -r docs/requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict --site-dir _site
