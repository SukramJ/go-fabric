# The real-controller guard. Everything else in this repository tests
# go-fabric against go-fabric; this workflow puts the CSA reference
# commissioner and the CSA certification harness on the other side of the
# wire, against the reference daemon in examples/reference-bridge.
#
# Everything runs in the module's harness image (ghcr.io/thingfabric/go-fabric-chip,
# matter.js's CHIP image plus chip's joint-fabric apps and Push AV server),
# pinned by digest in the Makefile (CHIP_TEST_IMAGE) — the single source for
# the commissioner, the harness and the CHIP reference apps, at one CHIP
# commit. The image is amd64, as the runners are. The
# container shares the host network and the runner's avahi over /run/dbus.
#
# Seven jobs besides `code touched` and the gate, and the second is the
# point:
#
#   - chiptool: `make chiptool-test` — commission the daemon for real, then
#     the chip-tool suite over one interactive session. The Go-TH leg
#     (TestGoCertificationCases) is left to the gocert job.
#   - gocert: the Go-TH leg (`make chiptool-gocert`), matter.js's cert cases
#     with the Go controller as TH and as DUT, in three groups by family
#     (GOFABRIC_GOCERT): gocert-cadmin, gocert-dd and gocert-rest, one
#     runner each — the cases share the daemon's fixed port, so they run
#     in parallel only across runners. TestWorkflowGoCertGroups holds the
#     groups to a partition of the golden file's families.
#   - chiptool-control: the CONTROL LEG. The same image, the same runner
#     setup, chip-tool pairing CHIP's own all-clusters app instead of the
#     reference daemon — no go-fabric code in the path at all. Green control
#     + red suite is a go-fabric defect; both red is the environment (an
#     image bump, a runner change, avahi/dbus, network). Without it every red
#     run starts with an hour of ruling the environment out.
#   - chiptool-ble-wifi: `make chiptool-ble-wifi` (wave 28c) — the image's
#     chip-tool-ble commissions examples/ble-wifi-light over BLE onto Wi-Fi
#     under chip's BlueZ and wpa_supplicant mocks in a privileged
#     container, with all-clusters-app-ble under the same mocks as its own
#     control in the same test. A required check since 2026-11-13.
#   - chiptool-ble-cases: `make chiptool-ble-cases` — chip's Python
#     certification cases whose TH commissions over BLE onto Wi-Fi in the
#     test, against examples/ble-wifi-light under the same mocks, with the
#     image's BLE-capable Python controller (/opt/matter-ble). Not a
#     required check; cheap (about seven minutes for eleven cases), so it
#     runs where the BLE-Wi-Fi leg runs and a release pull request gates on
#     it. An image without /opt/matter-ble skips it, naming why.
#   - chip-families: the CSA certification families (`make
#     chiptool-families`), the way matter.js runs them. Certification is not
#     pursued by this project, but certifiability is a goal
#     (docs/adr/0011-certifiability-is-a-goal.md): the families run with PICS
#     generated from the device, every excluded case carries its class and
#     reason, and docs/certifiability.md is the status. An unlabelled pull
#     request runs the core groups (core-su, core-idm, core-ace, core-rest)
#     and the commissioning groups (commissioning, commissioning-cadmin), in
#     parallel; the `needs-chiptool` label adds the application groups; the
#     nightly run, a manual dispatch and a release pull request run all of
#     them. `long` — the families whose one case waits for hours by design
#     (TC-DGGEN-2.1 sits through 3 h 10 min of literal waits for
#     TotalOperationalHours) — runs on the nightly run and a dispatch; a
#     release pull request reads its result on the base commit instead
#     (long-on-base below), unless the pull request itself changes code.
#     The groups are cut by measured duration so that no group outlasts the
#     longest single case (TC-SU-2.2, about 19 min): the job a run waits for
#     is the slowest group. A group an event does not run gets no job.
#   - long-on-base: a release pull request that changes documentation only
#     — `long`'s result on the pull request's base commit, from a nightly or
#     dispatched run of this workflow; the gate is red without a passed one.
#   - nested-release: a release pull request only — `make
#     nested-release-check`, each nested module built against the go-fabric
#     version its go.mod requires, its replace dropped (R2-P5-sup-01).
#
# Not a blanket per-PR gate — the runs are slow and the image is large. It
# runs nightly, on manual dispatch, on the `needs-chiptool` label, and
# automatically whenever a pull request changes anything but documentation.
#
# A RELEASE PULL REQUEST (head branch `release/*`, issue 495) runs the full
# set: every job above, and every family group the nightly run covers —
# `long` by its result on the base commit when the release pull request
# changes documentation only (owner, 2026-11-24: the release diff is the
# CHANGELOG, and the 3 h 10 min wait need not be paid twice for one tree;
# a release pull request that changes code runs `long` itself) — the full
# run is the gate of a release, not of every
# pull request (owner, 2026-11-10; v0.20.0 was tagged with an app-energy
# failure only the nightly run showed). The `changes` job computes it once:
# `full` (a labelled or release pull request) replaces the label test at
# every condition, `release` widens the family selection to `long`. The
# required check `chip certification cases against the reference daemon`
# (chip-families-gate) is the gate: on a release pull request it is red
# unless the suite, the control leg, the BLE-Wi-Fi leg, the BLE cases leg,
# the Go-TH groups, the nested modules' release shape and every family
# group ran and passed; on any other event it judges the families and the
# Go-TH groups. No new check name. ble-virtual.yml and otbr-virtual.yml
# stay outside the gate: they need kernel modules a hosted runner may lack
# and run weekly.
#
# That last trigger is wider here than in a consuming daemon, and deliberately
# so: this module IS the Matter stack, so almost any change to it can move
# commissioning. The rule is inverted for that reason: the run is skipped
# when every changed path is documentation (docs/, notes/, a Markdown file,
# mkdocs.yml, the .github files that are not workflows), and starts for
# everything else — Go code, the Makefile (the harness image's digest, the
# timeouts, the skip lists), and every file the daemon embeds (the SQL
# migrations, parity/schema.json, the DCL trust roots). A list of what
# starts it missed exactly those (R2-P5-sup-03); TestWorkflowCodeFilter
# holds the rule.

on:
  schedule:
    # Offset from the 03:17 nightly so the two heavy workflows do not compete
    # for runner capacity at the same minute.
    - cron: "47 3 * * *"
  pull_request:
    # `opened` is load-bearing and was missing: a freshly opened pull request
    # fires only that event, so without it the changes job below never ran on
    # the one event every pull request begins with. Found by this workflow's
    # own change failing to trigger itself.
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      families:
        description: "Certification families to run, comma-separated (empty: every group)"
        required: false
        default: ""
      update_fixtures:
        description: "Rewrite the PICS slices, the chip-cases golden and docs/certifiability.md and upload them as an artifact (a Linux harness run nobody has locally)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: chiptool-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  # Decides whether this pull request touches anything that can move
  # commissioning. A shell diff rather than a pinned third-party
  # paths-filter action: the rule is one grep, and an action would be one
  # more supply-chain edge for a boolean.
  #
  # Non-pull_request events short-circuit to false — schedule and dispatch
  # already run everything through the conditions below, and asking about a
  # diff there would compare unrelated commits.
  changes:
    name: code touched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      families: ${{ steps.groups.outputs.matrix }}
      full: ${{ steps.scope.outputs.full }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Whether this pull request runs the full set (issue 495). `release`: a
      # release pull request, head branch `release/*`. `full`: labelled
      # `needs-chiptool` or a release pull request — the one value every
      # job condition below reads in place of the label test. Both false on
      # every other event, whose own condition already runs everything.
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'needs-chiptool') }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          release=false
          full=false
          if [ "$EVENT" = "pull_request" ]; then
            if [[ "$HEAD_REF" == release/* ]]; then release=true; fi
            if [ "$LABELLED" = "true" ] || [ "$release" = "true" ]; then full=true; fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "head branch: ${HEAD_REF:-<none>}; release pull request: $release; full set: $full"
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "not a pull request -- the event's own condition decides"
            exit 0
          fi
          # --no-renames: a rename is its old path and its new one, so a
          # Go file moved to a Markdown name is not documentation only
          # (TestWorkflowFilterVerdict).
          changed=$(git diff --no-renames --name-only "$BASE" "$HEAD")
          echo "changed files:"; while IFS= read -r f; do echo "  $f"; done <<<"$changed"
          # Documentation only: the documentation trees, Markdown anywhere,
          # the site's configuration, the .github files that are not
          # workflows. Any other changed path starts the suite -- the Go
          # code, the Makefile, every embedded file, every workflow
          # (TestWorkflowCodeFilter holds this pattern).
          docs_only='^(docs/|notes/|mkdocs\.yml$|\.github/(dependabot\.yml|FUNDING\.yml|PULL_REQUEST_TEMPLATE\.md|SPONSORING\.md)$)|\.md$'
          if [ -n "$changed" ] && grep -Evq "$docs_only" <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> a path that is not documentation changed; the suite runs without a label"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> documentation only; the suite runs only if labelled"
          fi
      # The certification-family groups, and which of them this event runs.
      # One place for the split (TestWorkflowRunsEveryFamily holds it to the
      # family table): the groups divide internal/chiptool's family table so
      # no job exceeds the runner's six hours. An unlabelled pull request runs
      # the core-* groups and `commissioning` (TC-SC, TC-DA, TC-CADMIN and the
      # rest: a change under secure/, commissioning/, bridge/ or transport/
      # must not merge before they ran, W6-test-04); the `needs-chiptool`
      # label adds every group but `long`; the nightly run, a manual
      # dispatch and a release pull request (issue 495) run every group.
      # `long` holds the families whose case budget is hours (the family
      # table's timeout: TC-DGGEN-2.1 waits 3 h 10 min by design,
      # connectedhomeip#29580), so a pull request's chip run ends in under
      # an hour and the wait is paid once a night. A group that is not run
      # does not get a job at all, so it can neither look green nor hide a
      # skip.
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ steps.scope.outputs.full }}
          RELEASE: ${{ steps.scope.outputs.release }}
          CODE: ${{ steps.filter.outputs.code }}
          FAMILIES_INPUT: ${{ github.event.inputs.families }}
        run: |
          set -euo pipefail
          # A dispatch that names families runs exactly those, as one group.
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$FAMILIES_INPUT" ]; then
            include=$(jq -c -n --arg f "$FAMILIES_INPUT" '[{group: "custom", families: $f}]')
            echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
            echo "family groups this event runs: custom ($FAMILIES_INPUT)"
            exit 0
          fi
          groups=(
            "core-su=SU"
            "core-idm=IDM"
            "core-ace=ACE,ACL,OPCREDS,CGEN"
            "core-rest=DESC,BINFO,BRBINFO,GRPKEY,DT,RR,SM,TIMESYNC,DLOG,ICDM,BDX,BIND,FLABEL,ULABEL,LCFG,LTIME,LUNIT,DGSW,DGETH,DGWIFI,ACT,PSCFG,ECOINFO,MESS"
            "commissioning=SC,DA,DD,CNET,CNETWIFI,CGENTC,G,GC"
            "commissioning-cadmin=CADMIN"
            "app-lights=OO,LVL,I,S,SWTCH,BOOL,BOOLCFG,OCC,TMP,RH,FLW,CDOCONC,CMOCONC,FLDCONC,NDOCONC,OZCONC,PMHCONC,RNCONC,TVOCCONC,AIRQUAL,PMICONC,PMKCONC,SOIL"
            "app-lights-cc=CC"
            "app-appliances=DRLK,FAN,OPSTATE,VALCC,WNCV"
            "app-appliances-rest=LWM,WASHERCTRL,DRYERCTRL,MOD,PCC,PS,RVCCLEANM,RVCOPSTATE,RVCRUNM,SMOKECO,TSTAT,HEPAFREMON,ACFREMON,CLCTRL,TCCM,TCTL,EPREF,EWATERHTR,WHM,MTRID,DISHALM,REFALM,OVENOPSTATE,OTCCM,MWOCTRL,MWOM,SEAR,CLDIM,TSUIC"
            "app-energy=DEM,DEMM,EEVSE,EEVSEM,SETRF,COMMTR,EGC,SEPR,EEM,EPM,PWRTL"
            "app-media=ALOGIN,APBSC,APPLAUNCHER,APPOBSERVER,AUDIOOUTPUT,CHANNEL,CONTENTLAUNCHER,KEYPADINPUT,LOWPOWER,MEDIAINPUT,MEDIAPLAYBACK,TGTNAV,WAKEONLAN"
            "app-tls=TLSCERT,TLSCLIENT"
            "app-camera=WEBRTCP,WebRTCP,AVSM,AVSUM,ZONEMGMT,PAVST,PAVSTI,CHIME"
            "app-jointfabric=JFADMIN,JFDS"
            "long=DGGEN"
            "thread=TBRM,DGTHREAD,THNETDIR"
          )
          # core-* and commissioning*: every event. long: never a pull
          # request but a release one that changes code (a documentation-only
          # one reads long's result on its base commit, job long-on-base).
          # thread: never here — it needs the
          # virtual OTBR agent and runs in otbr-virtual.yml (dispatch and
          # weekly), after the agent's own live test. The rest: every event
          # but a pull request that is neither labelled nor a release one.
          include="[]"
          for entry in "${groups[@]}"; do
            group="${entry%%=*}"; families="${entry#*=}"
            runs=false
            if [ "$group" = thread ]; then
              continue
            elif [[ "$group" == core-* ]] || [[ "$group" == commissioning* ]]; then
              runs=true
            elif [ "$group" = long ]; then
              if [ "$EVENT" != "pull_request" ] || { [ "$RELEASE" = "true" ] && [ "$CODE" = "true" ]; }; then runs=true; fi
            elif [ "$EVENT" != "pull_request" ] || [ "$FULL" = "true" ]; then
              runs=true
            fi
            if [ "$runs" = true ]; then
              include=$(jq -c --arg g "$group" --arg f "$families" '. + [{group: $g, families: $f}]' <<<"$include")
            fi
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "family groups this event runs: $(jq -r '.[].group' <<<"$include" | paste -sd, -)"

  chiptool:
    name: chip-tool commissions the reference daemon
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Without the Go-TH leg (the gocert job's), the suite step ran about
    # two minutes on 2026-11-15 (run 43707934752: 42 minutes for the step,
    # 2453 s of it TestGoCertificationCases).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # chip-tool resolves the daemon's operational record after AddNOC
      # through the host's avahi (the container mounts /run/dbus).
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon

      - name: pull the pinned CHIP image
        run: make chiptool-image

      # The matter.js controller leg (TestMatterJSController) drives the
      # daemon from matter.js's CommissioningController, built from the
      # matter.js commit the schema snapshot was extracted from
      # (parity/schema.json matter.sourceCommit) and checked out next to
      # the module, where the test looks for it. The built tree is cached
      # per commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: matter.js pin
        id: matterjs
        run: echo "sha=$(jq -r .matter.sourceCommit parity/schema.json)" >> "$GITHUB_OUTPUT"
      - name: cache the built matter.js
        id: matterjs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../matter.js
          key: matterjs-${{ steps.matterjs.outputs.sha }}-node22
      - name: build matter.js at the pin
        if: steps.matterjs-cache.outputs.cache-hit != 'true'
        # The pin is read from the pull request's own tree: it reaches the
        # script through the environment, never as an expression inside it
        # (R2-P5-sup-15).
        env:
          MATTERJS_SHA: ${{ steps.matterjs.outputs.sha }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/matter-js/matter.js "$GITHUB_WORKSPACE/../matter.js"
          cd "$GITHUB_WORKSPACE/../matter.js"
          git checkout --detach "$MATTERJS_SHA"
          npm ci --no-audit --no-fund
          npm run build

      # The suite skips itself when no harness is usable, and the matter.js
      # leg when no built matter.js is found; in CI either would be a silent
      # green, so the run is checked for both skips.
      - name: chip-tool suite
        run: |
          set -o pipefail
          # The Go-TH leg runs in the gocert job, in groups.
          GOFABRIC_CHIP_HARNESS=image make chiptool-test CHIPTOOL_TEST_SKIP_GOCERT=1 2>&1 | tee /tmp/chiptool.log
          if grep -q -- "--- SKIP: TestChipTool" /tmp/chiptool.log; then
            echo "::error::the chip-tool suite skipped itself; the harness was not usable"
            exit 1
          fi
          if grep -q -- "--- SKIP: TestMatterJSController" /tmp/chiptool.log; then
            echo "::error::the matter.js controller leg skipped itself; matter.js was not built"
            exit 1
          fi
          # The chip-tool group leg (TestChipToolSuite/groups) sends a
          # multicast OnOff Toggle; a skip means the runner had no IPv6
          # multicast and the proof did not run.
          if grep -q -- "--- SKIP: TestChipToolSuite/groups " /tmp/chiptool.log; then
            echo "::error::the chip-tool group leg skipped itself; the runner has no IPv6 multicast"
            exit 1
          fi

      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chiptool-logs
          path: /tmp/chiptool.log
          if-no-files-found: ignore

  # The Go-TH leg (TestGoCertificationCases): matter.js's cert cases with
  # the Go controller as TH, read mirrored, and as DUT. Each case starts a
  # fresh reference daemon on the fixed port 5540, so the cases of one
  # runner run one after the other, and the leg is split across runners by
  # family (GOFABRIC_GOCERT, gocert_test.go). The three groups, measured
  # on a runner (run 43707934752, 2026-11-15): CADMIN 1134 s, whose cases
  # wait out commissioning windows; DD, SC, BDX and BIND 586 s; the rest
  # 733 s. The rest group is an exclusion, so a new family joins it without
  # an edit here; TestWorkflowGoCertGroups holds the three to a partition
  # of the golden file's families. A matrix job cannot be a required check
  # (its check names are the expanded ones); the gate below holds it.
  gocert:
    name: Go-TH certification cases (${{ matrix.group }})
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: gocert-cadmin
            families: "CADMIN"
          - group: gocert-dd
            families: "DD,SC,BDX,BIND"
          - group: gocert-rest
            families: "-CADMIN,-DD,-SC,-BDX,-BIND"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The same runner setup as the suite's: the leg ran inside it until
      # the split, avahi included.
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon
      # CAMERA-GO starts CHIP's camera app from the harness image
      # (gocert_camera_test.go); its family is in the rest group.
      - name: pull the pinned CHIP image
        if: matrix.group == 'gocert-rest'
        run: make chiptool-image
      # A skip is a case not run, and in CI it would be a silent green, so
      # the run is checked for every one: the leg's own (no multicast for
      # discovery) and a case's (TC-BIND-2.3 and TC-SC-5.3 send group
      # messages and skip on a host whose LAN interfaces have no IPv6 —
      # lanIPv6, the criterion the suite's group leg above fails on on the
      # same runner image; no case skips legitimately here). The leg must
      # also report its own PASS line: a -run that matches nothing passes
      # with no test run. An entry of GOFABRIC_GOCERT that names no
      # registered case fails the test. TestWorkflowGoCertStepVerdict runs
      # this script against sample logs.
      - name: Go-TH cases
        env:
          GOFABRIC_GOCERT: ${{ matrix.families }}
        run: |
          set -o pipefail
          make chiptool-gocert CHIPTOOL_TIMEOUT=40m 2>&1 | tee /tmp/gocert.log
          if grep -q -- "--- SKIP: TestGoCertificationCases" /tmp/gocert.log; then
            grep -- "--- SKIP: TestGoCertificationCases" /tmp/gocert.log
            echo "::error::the Go-TH certification leg skipped itself or a case (above); the runner has no IPv6 multicast"
            exit 1
          fi
          if ! grep -q -E -- "^--- PASS: TestGoCertificationCases \(" /tmp/gocert.log; then
            echo "::error::the Go-TH certification leg reported no PASS line; no case ran"
            exit 1
          fi
      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gocert-logs-${{ matrix.group }}
          path: /tmp/gocert.log
          if-no-files-found: ignore

  chiptool-control:
    # The name is a required status check on main (branch protection); keep
    # it byte-for-byte, or every pull request waits on a check nobody reports.
    name: chip-tool control leg (CHIP app, no go-fabric)
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon
      - name: pull the pinned CHIP image
        run: make chiptool-image
      # Same container setup as the suite (internal/chiptool/harness_test.go
      # launchHarness): host network, apparmor unconfined for avahi over
      # dbus, the host's /run/dbus.
      - name: pair the all-clusters app and read its parts list
        run: |
          set -euo pipefail
          image=$(sed -n 's/^CHIP_TEST_IMAGE[[:space:]]*?=[[:space:]]*//p' Makefile)
          docker run -d --name chip-control --network host --security-opt apparmor=unconfined \
            -v /run/dbus:/run/dbus --entrypoint sleep "$image" infinity
          docker exec -d chip-control sh -c '/bin/chip-all-clusters-app --KVS /tmp/kvs-app > /tmp/app.log 2>&1'
          # chip-tool writes its KVS into --storage-directory but does not
          # create it: PersistentStorage::CommitConfig opens
          # <dir>/chip_tool_config.ini.tmp and fails with
          # CHIP_ERROR_WRITE_FAILED (ExamplePersistentStorage.cpp:210) when
          # the directory is missing.
          docker exec chip-control mkdir -p /tmp/kvs-ctl
          sleep 5
          docker exec chip-control /bin/chip-tool pairing onnetwork-long 1 20202021 3840 \
            --storage-directory /tmp/kvs-ctl 2>&1 | tee /tmp/pair.log
          grep -q "Device commissioning completed with success" /tmp/pair.log \
            || { echo "::error::chip-tool could not commission CHIP's own all-clusters app"; exit 1; }
          docker exec chip-control /bin/chip-tool descriptor read parts-list 1 0 \
            --storage-directory /tmp/kvs-ctl 2>&1 | tee /tmp/read.log
          grep -q "PartsList" /tmp/read.log \
            || { echo "::error::Descriptor.PartsList not returned by the all-clusters app"; exit 1; }
      - name: collect logs
        if: always()
        # The container's /tmp/app.log, copied to the runner's: two files,
        # whatever shellcheck reads from the one path (SC2094).
        run: docker cp chip-control:/tmp/app.log /tmp/app.log 2>/dev/null || true
      - name: upload control-leg logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chiptool-control-logs
          path: |
            /tmp/app.log
            /tmp/pair.log
            /tmp/read.log
          if-no-files-found: ignore

  chiptool-ble-wifi:
    # The name is a required status check on main (branch protection, since
    # 2026-11-13); keep it when the job moves.
    name: chip-tool commissions over BLE onto Wi-Fi (chip's mocks)
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: pull the pinned CHIP image
        run: make chiptool-image
      # The test's container is privileged (network namespaces, bluezoo,
      # the wpa_supplicant mock); nothing runs on the runner's own network
      # or Bluetooth.
      - name: BLE-Wi-Fi leg and its control
        run: make chiptool-ble-wifi

  chiptool-ble-cases:
    name: certification cases commissioning over BLE onto Wi-Fi (chip's mocks)
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: pull the pinned CHIP image
        run: make chiptool-image
      # Privileged containers, one per case (network namespaces, bluezoo,
      # the wpa_supplicant mock); nothing runs on the runner's own network
      # or Bluetooth.
      - name: BLE cases and their control
        run: make chiptool-ble-cases

  chip-families:
    name: certification families (${{ matrix.group }})
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Decided by the `code touched` job: see its `groups` step.
      matrix: ${{ fromJSON(needs.changes.outputs.families) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon
      - name: pull the pinned CHIP image
        run: make chiptool-image
      - name: families
        env:
          GOFABRIC_CHIP_FAMILIES: ${{ matrix.families }}
          GOFABRIC_CHIP_HARNESS: image
          UPDATE_FIXTURES: ${{ github.event.inputs.update_fixtures }}
        run: |
          set -o pipefail
          target=chiptool-families
          if [ "$UPDATE_FIXTURES" = "true" ]; then target=chiptool-families-update; fi
          make "$target" 2>&1 | tee /tmp/families.log
          if grep -q -- "--- SKIP: TestChipCertificationFamilies " /tmp/families.log; then
            echo "::error::the certification families skipped themselves; the harness was not usable"
            exit 1
          fi
      - name: upload rewritten fixtures
        if: always() && github.event.inputs.update_fixtures == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chip-fixtures-${{ matrix.group }}
          # The variants' slices too (testdata/pics-<variant>/): a family
          # that runs against a daemon variant rewrites that directory, and
          # a composition change on the root moves every variant's ep0.
          path: |
            internal/chiptool/testdata/pics
            internal/chiptool/testdata/pics-*
            internal/chiptool/testdata/chip-cases.golden.json
            docs/certifiability.md
          if-no-files-found: error
      - name: upload case logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chip-families-${{ matrix.group }}
          path: |
            /tmp/families.log
            bin/chip-harness/logs
          if-no-files-found: ignore

  # A release pull request only (R2-P5-sup-01): each nested module built
  # with its replace of go-fabric dropped, against the versions its go.mod
  # requires — the build a consumer gets once the module is tagged. A
  # nested release pull request (head branch release/nested-*, the shape
  # of release/nested-v0.22.0 and release/nested-v0.22.1) bumps those
  # requires to published tags, and a module that does not compile against
  # them fails here. A root release pull request tags no nested module as
  # a rule, so a module out of release shape is a warning there: the next
  # nested release must bump its require — unless the pull request changes
  # a nested go.mod, which is a nested release in all but its branch name,
  # and is held as strictly (owner decision 103 of review II).
  #
  # A nested release pull request tags its merge commit <dir>/vX.Y.Z, the
  # version its branch name release/nested-vX.Y.Z carries, for each nested
  # module whose go.mod it changes and that this repository tags (one with
  # a <dir>/v* tag already; an example is not tagged). Those tags are
  # passed as --released: a sibling's require of such a version is built
  # against the sibling's checked copy instead of failing for a tag only
  # the merge can make (owner decision 266, the example of #546).
  nested-release:
    name: nested modules against the versions they require
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The requires are checked against this repository's tags.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: release shape of the nested modules
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if ! changed=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
            echo "::error::cannot list the files this pull request changes"
            exit 1
          fi
          released=()
          if [[ "$HEAD_REF" == release/nested-* ]]; then
            version="${HEAD_REF#release/nested-}"
            while IFS= read -r f; do
              case "$f" in */go.mod) dir="${f%/go.mod}" ;; *) continue ;; esac
              if [ -n "$(git tag -l "$dir/v*")" ]; then released+=(--released "$dir/$version"); fi
            done <<<"$changed"
            echo "released by this pull request: ${released[*]:-none}"
          fi
          rc=0
          script/nested-release-check.sh "${released[@]}" || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          nested_gomod=false
          if grep -qE '^.+/go\.mod$' <<<"$changed"; then nested_gomod=true; fi
          if [ "$rc" -eq 1 ] && [[ "$HEAD_REF" != release/nested-* ]] && [ "$nested_gomod" = false ]; then
            echo "::warning::a nested module is not in release shape (above); this root release does not tag it, but the next nested release must bump its require"
            exit 0
          fi
          echo "::error::the nested modules are not in release shape (exit $rc, above)"
          exit 1

  # `long` on the base commit, for a release pull request that changes
  # documentation only (owner, 2026-11-24). Its tree differs from the base
  # commit's in documentation alone, so `long`'s result there is its result:
  # the job looks up a completed nightly or dispatched run of this workflow
  # on the base commit whose `certification families (long)` job passed.
  # Without one it is red and says how to get one: dispatch this workflow
  # on main while main is the base commit (a dispatch shares the nightly
  # run's concurrency group, so it cancels a nightly run in progress).
  long-on-base:
    name: certification families (long) on the base commit
    needs: changes
    if: needs.changes.outputs.release == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$REPO/actions/workflows/chiptool.yml/runs?head_sha=$BASE&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch") | .id')
          for id in $runs; do
            verdict=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '.jobs[] | select(.name == "certification families (long)") | .conclusion')
            if [ "$verdict" = "success" ]; then
              echo "long passed on the base commit $BASE in run $id"
              exit 0
            fi
          done
          echo "::error::no passed 'certification families (long)' on the base commit $BASE (runs looked at: ${runs:-none}); dispatch chiptool.yml on main while main is $BASE, or wait for the nightly run"
          exit 1

  # The required status check for the certification families. Branch
  # protection on main names it, and a matrix job cannot serve: its check
  # names depend on the groups an event runs, and a skipped matrix job
  # reports under its unexpanded name. This job always reports, under one
  # fixed name: green when every family group and every Go-TH group that
  # ran passed (or the suite was not due at all), red when one failed or
  # was cancelled. The Go-TH groups (job gocert) are held here since they
  # left the suite's job (review II, phase 5a): they run exactly when the
  # family groups do, so skipped is accepted only with the families
  # skipped too.
  #
  # On a release pull request (issue 495) it is the release gate and fails
  # closed: every job of the full run — the suite, the control leg, the
  # BLE-Wi-Fi leg, the BLE cases leg, the Go-TH groups, the nested modules'
  # release shape and the family groups — must have run and passed; a
  # skipped, failed or cancelled one is red. A release pull request that
  # changes documentation only gets `long` from long-on-base, which must
  # have passed as well. That is why it needs every leg; on every other
  # event only the families and the Go-TH groups are read.
  chip-families-gate:
    name: chip certification cases against the reference daemon
    needs: [changes, chiptool, gocert, chiptool-control, chiptool-ble-wifi, chiptool-ble-cases, chip-families, nested-release, long-on-base]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FAMILIES: ${{ needs.chip-families.result }}
          GOCERT: ${{ needs.gocert.result }}
          CHANGES: ${{ needs.changes.result }}
          RELEASE: ${{ needs.changes.outputs.release }}
          SUITE: ${{ needs.chiptool.result }}
          CONTROL: ${{ needs.chiptool-control.result }}
          BLE_WIFI: ${{ needs.chiptool-ble-wifi.result }}
          BLE_CASES: ${{ needs.chiptool-ble-cases.result }}
          NESTED: ${{ needs.nested-release.result }}
          CODE: ${{ needs.changes.outputs.code }}
          LONG_BASE: ${{ needs.long-on-base.result }}
        run: |
          echo "code touched: $CHANGES; certification families: $FAMILIES; Go-TH groups: $GOCERT"
          if [ "$RELEASE" = "true" ]; then
            echo "release pull request: suite $SUITE, control leg $CONTROL, BLE-Wi-Fi leg $BLE_WIFI, BLE cases leg $BLE_CASES, nested modules $NESTED"
            failed=0
            legs=("chip-tool suite=$SUITE" "Go-TH groups=$GOCERT" "control leg=$CONTROL" "BLE-Wi-Fi leg=$BLE_WIFI" "BLE cases leg=$BLE_CASES" "nested modules' release shape=$NESTED" "certification families=$FAMILIES")
            if [ "$CODE" != "true" ]; then legs+=("long on the base commit=$LONG_BASE"); fi
            for leg in "${legs[@]}"; do
              if [ "${leg#*=}" != "success" ]; then
                echo "::error::release gate: the ${leg%%=*} did not pass (${leg#*=})"
                failed=1
              fi
            done
            if [ "$failed" -ne 0 ]; then exit 1; fi
          fi
          case "$CHANGES/$FAMILIES/$GOCERT" in
            success/success/success|success/skipped/skipped) exit 0 ;;
            *) echo "::error::the certification families ($FAMILIES) and the Go-TH groups ($GOCERT) did not both pass or both stay undue (code touched: $CHANGES)"; exit 1 ;;
          esac
