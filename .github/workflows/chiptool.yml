# The real-controller guard. Everything else in this repository tests
# go-fabric against go-fabric; this workflow puts the CSA reference
# commissioner and the CSA certification harness on the other side of the
# wire, against the reference daemon in examples/reference-bridge.
#
# Everything runs in matter.js's CHIP image (ghcr.io/matter-js/chip), pinned
# by digest in the Makefile (CHIP_TEST_IMAGE) — the single source for the
# commissioner, the harness and the CHIP reference apps, at one CHIP commit.
# The image is multi-arch, so the jobs run on ordinary amd64 runners. The
# container shares the host network and the runner's avahi over /run/dbus.
#
# Three jobs, and the second is the point:
#
#   - chiptool: `make chiptool-test` — commission the daemon for real, then
#     the chip-tool suite over one interactive session.
#   - chiptool-control: the CONTROL LEG. The same image, the same runner
#     setup, chip-tool pairing CHIP's own all-clusters app instead of the
#     reference daemon — no go-fabric code in the path at all. Green control
#     + red suite is a go-fabric defect; both red is the environment (an
#     image bump, a runner change, avahi/dbus, network). Without it every red
#     run starts with an hour of ruling the environment out.
#   - chip-families: the CSA certification families (`make
#     chiptool-families`), the way matter.js runs them. Certification is not
#     pursued by this project, but certifiability is a goal
#     (docs/adr/0011-certifiability-is-a-goal.md): the families run with PICS
#     generated from the device, every excluded case carries its class and
#     reason, and docs/certifiability.md is the status. An unlabelled pull
#     request runs the core families; the nightly run, a manual dispatch and
#     the `needs-chiptool` label run all of them, split into groups so no job
#     exceeds the runner limit. A group an event does not run gets no job.
#
# Not a blanket per-PR gate — the runs are slow and the image is large. It
# runs nightly, on manual dispatch, on the `needs-chiptool` label, and
# automatically whenever a pull request touches Go code.
#
# That last trigger is wider here than in a consuming daemon, and deliberately
# so: this module IS the Matter stack, so almost any change to it can move
# commissioning. A path list would be a list of nearly every directory, which
# is a filter that reads as one and is not. Documentation, the changelog and
# the notes tree do not start it; anything the binary is built from does.

on:
  schedule:
    # Offset from the 03:17 nightly so the two heavy workflows do not compete
    # for runner capacity at the same minute.
    - cron: "47 3 * * *"
  pull_request:
    # `opened` is load-bearing and was missing: a freshly opened pull request
    # fires only that event, so without it the changes job below never ran on
    # the one event every pull request begins with. Found by this workflow's
    # own change failing to trigger itself.
    types: [opened, labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chiptool-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.2"

jobs:
  # Decides whether this pull request touches anything that can move
  # commissioning. A shell diff rather than a pinned third-party
  # paths-filter action: the rule is one grep, and an action would be one
  # more supply-chain edge for a boolean.
  #
  # Non-pull_request events short-circuit to false — schedule and dispatch
  # already run everything through the conditions below, and asking about a
  # diff there would compare unrelated commits.
  changes:
    name: code touched
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      families: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "not a pull request -- the event's own condition decides"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Anything the binary is built from, plus this workflow so a change
          # to it is tested by it. Everything else -- markdown, the notes
          # tree, the changelog -- leaves the suite to the label.
          if echo "$changed" | grep -Eq \
            -e '\.go$' \
            -e '^go\.(mod|sum)$' \
            -e '^\.github/workflows/chiptool\.yml$' \
            -e '^internal/chiptool/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "-> commissioner suite runs without a label"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "-> no Go code touched; suite runs only if labelled"
          fi
      # The certification-family groups, and which of them this event runs.
      # One place for the split (TestWorkflowRunsEveryFamily holds it to the
      # family table): the groups divide internal/chiptool's family table so
      # no job exceeds the runner's six hours. An unlabelled pull request runs
      # the core group only; the nightly run, a manual dispatch and the
      # `needs-chiptool` label run every group. A group that is not run does
      # not get a job at all, so it can neither look green nor hide a skip.
      - id: groups
        env:
          EVENT: ${{ github.event_name }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'needs-chiptool') }}
        run: |
          set -euo pipefail
          groups=(
            "core=IDM,DESC,BINFO,BRBINFO,ACE,ACL,CGEN,OPCREDS,GRPKEY,DT,RR,SM,TIMESYNC,DLOG,ICDM,SU,BIND"
            "commissioning=CADMIN,SC,DA,DD,CNET,DGGEN,G,GC"
            "app-lights=OO,LVL,CC,I,S,SWTCH,BOOL,OCC,TMP,RH,FLW"
            "app-appliances=DRLK,FAN,LWM,MOD,OPSTATE,PCC,PS,RVCCLEANM,RVCOPSTATE,RVCRUNM,SMOKECO,TSTAT,VALCC,WNCV,HEPAFREMON,ACFREMON,CLCTRL"
          )
          all=true
          if [ "$EVENT" = "pull_request" ] && [ "$LABELLED" != "true" ]; then
            all=false
          fi
          include="[]"
          for entry in "${groups[@]}"; do
            group="${entry%%=*}"; families="${entry#*=}"
            if [ "$all" = true ] || [ "$group" = core ]; then
              include=$(jq -c --arg g "$group" --arg f "$families" '. + [{group: $g, families: $f}]' <<<"$include")
            fi
          done
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          echo "family groups this event runs: $(jq -r '.[].group' <<<"$include" | paste -sd, -)"

  chiptool:
    name: chip-tool commissions the reference daemon
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-chiptool') ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # chip-tool resolves the daemon's operational record after AddNOC
      # through the host's avahi (the container mounts /run/dbus).
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon

      - name: pull the pinned CHIP image
        run: make chiptool-image

      # The matter.js controller leg (TestMatterJSController) drives the
      # daemon from matter.js's CommissioningController, built from the
      # matter.js commit the schema snapshot was extracted from
      # (parity/schema.json matter.sourceCommit) and checked out next to
      # the module, where the test looks for it. The built tree is cached
      # per commit.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: matter.js pin
        id: matterjs
        run: echo "sha=$(jq -r .matter.sourceCommit parity/schema.json)" >> "$GITHUB_OUTPUT"
      - name: cache the built matter.js
        id: matterjs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/../matter.js
          key: matterjs-${{ steps.matterjs.outputs.sha }}-node22
      - name: build matter.js at the pin
        if: steps.matterjs-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none https://github.com/matter-js/matter.js "$GITHUB_WORKSPACE/../matter.js"
          cd "$GITHUB_WORKSPACE/../matter.js"
          git checkout --detach "${{ steps.matterjs.outputs.sha }}"
          npm ci --no-audit --no-fund
          npm run build

      # The suite skips itself when no harness is usable, and the matter.js
      # leg when no built matter.js is found; in CI either would be a silent
      # green, so the run is checked for both skips.
      - name: chip-tool suite
        run: |
          set -o pipefail
          GOFABRIC_CHIP_HARNESS=image make chiptool-test 2>&1 | tee /tmp/chiptool.log
          if grep -q -- "--- SKIP: TestChipTool" /tmp/chiptool.log; then
            echo "::error::the chip-tool suite skipped itself; the harness was not usable"
            exit 1
          fi
          if grep -q -- "--- SKIP: TestMatterJSController" /tmp/chiptool.log; then
            echo "::error::the matter.js controller leg skipped itself; matter.js was not built"
            exit 1
          fi

      - name: upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chiptool-logs
          path: /tmp/chiptool.log
          if-no-files-found: ignore

  chiptool-control:
    # The name is a required status check on main (branch protection); keep
    # it byte-for-byte, or every pull request waits on a check nobody reports.
    name: chip-tool control leg (CHIP app, no go-fabric)
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-chiptool') ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon
      - name: pull the pinned CHIP image
        run: make chiptool-image
      # Same container setup as the suite (internal/chiptool/harness_test.go
      # launchHarness): host network, apparmor unconfined for avahi over
      # dbus, the host's /run/dbus.
      - name: pair the all-clusters app and read its parts list
        run: |
          set -euo pipefail
          image=$(sed -n 's/^CHIP_TEST_IMAGE[[:space:]]*?=[[:space:]]*//p' Makefile)
          docker run -d --name chip-control --network host --security-opt apparmor=unconfined \
            -v /run/dbus:/run/dbus --entrypoint sleep "$image" infinity
          docker exec -d chip-control sh -c '/bin/chip-all-clusters-app --KVS /tmp/kvs-app > /tmp/app.log 2>&1'
          # chip-tool writes its KVS into --storage-directory but does not
          # create it: PersistentStorage::CommitConfig opens
          # <dir>/chip_tool_config.ini.tmp and fails with
          # CHIP_ERROR_WRITE_FAILED (ExamplePersistentStorage.cpp:210) when
          # the directory is missing.
          docker exec chip-control mkdir -p /tmp/kvs-ctl
          sleep 5
          docker exec chip-control /bin/chip-tool pairing onnetwork-long 1 20202021 3840 \
            --storage-directory /tmp/kvs-ctl 2>&1 | tee /tmp/pair.log
          grep -q "Device commissioning completed with success" /tmp/pair.log \
            || { echo "::error::chip-tool could not commission CHIP's own all-clusters app"; exit 1; }
          docker exec chip-control /bin/chip-tool descriptor read parts-list 1 0 \
            --storage-directory /tmp/kvs-ctl 2>&1 | tee /tmp/read.log
          grep -q "PartsList" /tmp/read.log \
            || { echo "::error::Descriptor.PartsList not returned by the all-clusters app"; exit 1; }
      - name: collect logs
        if: always()
        run: docker exec chip-control cat /tmp/app.log > /tmp/app.log 2>/dev/null || true
      - name: upload control-leg logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chiptool-control-logs
          path: |
            /tmp/app.log
            /tmp/pair.log
            /tmp/read.log
          if-no-files-found: ignore

  chip-families:
    name: certification families (${{ matrix.group }})
    needs: changes
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'needs-chiptool') ||
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Decided by the `code touched` job: see its `groups` step.
      matrix: ${{ fromJSON(needs.changes.outputs.families) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          # The runner's docker0 bridge has no carrier in a host-network
          # setup, yet avahi listens on it and hands resolvers addresses
          # scoped to it (fe80::…%docker0, 10.1.0.x%docker0): unreachable
          # routes and stale cache entries. The DUT and every controller
          # share the host network, so avahi only needs the real interfaces.
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          grep -q '^deny-interfaces=docker0$' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon
      - name: pull the pinned CHIP image
        run: make chiptool-image
      - name: families
        env:
          GOFABRIC_CHIP_FAMILIES: ${{ matrix.families }}
          GOFABRIC_CHIP_HARNESS: image
        run: |
          set -o pipefail
          make chiptool-families 2>&1 | tee /tmp/families.log
          if grep -q -- "--- SKIP: TestChipCertificationFamilies " /tmp/families.log; then
            echo "::error::the certification families skipped themselves; the harness was not usable"
            exit 1
          fi
      - name: upload case logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chip-families-${{ matrix.group }}
          path: |
            /tmp/families.log
            bin/chip-harness/logs
          if-no-files-found: ignore

  # The required status check for the certification families. Branch
  # protection on main names it, and a matrix job cannot serve: its check
  # names depend on the groups an event runs, and a skipped matrix job
  # reports under its unexpanded name. This job always reports, under one
  # fixed name: green when every family group that ran passed (or the suite
  # was not due at all), red when one failed or was cancelled.
  chip-families-gate:
    name: chip certification cases against the reference daemon
    needs: [changes, chip-families]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          FAMILIES: ${{ needs.chip-families.result }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "code touched: $CHANGES; certification families: $FAMILIES"
          case "$CHANGES/$FAMILIES" in
            success/success|success/skipped) exit 0 ;;
            *) echo "::error::a certification family group did not pass ($FAMILIES)"; exit 1 ;;
          esac
