name: matter.js pin

# This module is a semantic port of matter.js pinned at one commit:
# parity/schema.json records it as matter.sourceCommit, and every parity test
# plus the generated schema/ package is true against that revision and no
# other. Nothing in the repository can see the pin expire — the schema parity
# test compares two in-repo copies of the same extract, so it stays green
# however old the extract gets. This job is the only thing that looks upstream.
#
# Not on pull_request, and deliberately so: the measurement depends on the
# network and on the state of somebody else's default branch, so it can go red
# for a reason no contributor's diff caused and no contributor's diff can fix.
# A gate like that on the merge path teaches people to ignore red.
#
# Weekly rather than nightly: the quantity it measures moves about three
# commits a month (see script/matterjs-pin-distance.sh), so a daily run
# re-reports the same number six days out of seven, and a daily red is a
# notification people filter. Nightly is for work that can change overnight.

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin-distance:
    name: pin distance to matter.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A blobless, unchecked-out clone: the measurement reads commit and tree
      # history only, never file contents, and this fetches ~11 MB against a
      # full clone's several hundred. Not a shallow clone — `--depth` would
      # truncate the history the pin sits in, and the distance to a commit the
      # clone cannot see is unmeasurable, which a naive count would render as
      # zero. Not a submodule and nothing vendored: this is a measurement of
      # upstream's current state, not a dependency of the build.
      #
      # matter-js/matter.js is the current canonical location; the older
      # project-chip/matter.js path still redirects here.
      - name: clone matter.js history
        run: |
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/matter-js/matter.js.git "${RUNNER_TEMP}/matter.js"

      # The check itself is three git invocations and one JSON field read, so
      # it is a shell script rather than a Go program under script/ — it needs
      # no toolchain, and it stays out of this module's package graph and its
      # build, vet, coverage and reachability gates.
      #
      # Exit codes: 0 within threshold, 1 over it, 2 when the measurement could
      # not be performed at all (an unreadable pin, a pin that is not on
      # upstream's default branch). Two is a failure on purpose — a check that
      # could not run must not be reported as a check that passed.
      - name: measure the pin's distance from matter.js HEAD
        run: bash script/matterjs-pin-distance.sh "${RUNNER_TEMP}/matter.js"

  # The Ahead-of-matter.js register (notes/parity/by_design.md) names, per
  # row, a matter.js file and a text that holds while matter.js lacks the
  # behaviour this module implements ahead of it. script/aheadcheck reads
  # each marker at the pin and at matter.js's default branch; a text gone at
  # the branch is the finding "caught up?" naming the row, and the job goes
  # red. The reconciliation itself stays a pin-lift task
  # (notes/parity/pin-lifts.md); this job is its trigger, issue #274.
  #
  # After pin-distance, and independent of its verdict: a stale pin is no
  # reason not to look at the markers. Nothing in the pin-distance job
  # changes for this one.
  ahead-markers:
    name: Ahead-of-matter.js markers
    runs-on: ubuntu-latest
    needs: pin-distance
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The same blobless, unchecked-out clone as pin-distance: history and
      # trees, no file contents. `git fetch --filter=blob:none` would not add
      # contents either; instead `git show <rev>:<path>`, which the check
      # runs for each marker at the pin and at origin/main, makes git fetch
      # exactly that blob from the promisor remote. The clone size before and
      # after goes into the job summary, so a check that started pulling the
      # tree would show.
      - name: clone matter.js history
        run: |
          git clone --filter=blob:none --no-checkout --quiet \
            https://github.com/matter-js/matter.js.git "${RUNNER_TEMP}/matter.js"
          du -sk "${RUNNER_TEMP}/matter.js/.git" | cut -f1 > "${RUNNER_TEMP}/clone-before-kb"

      # Exit 1 is a finding (a row that is wrong at the pin, or "caught up?"
      # at origin/main), 2 a check that could not run; both are red.
      - name: check the markers at the pin and at origin/main
        run: |
          set +e
          make ahead-check MATTERJS_DIR="${RUNNER_TEMP}/matter.js" MATTERJS_REF=origin/main \
            > "${RUNNER_TEMP}/ahead-check.log" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/ahead-check.log"
          before=$(cat "${RUNNER_TEMP}/clone-before-kb")
          after=$(du -sk "${RUNNER_TEMP}/matter.js/.git" | cut -f1)
          {
            echo "### Ahead-of-matter.js markers"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| matter.js origin/main | \`$(git -C "${RUNNER_TEMP}/matter.js" rev-parse origin/main)\` |"
            echo "| Clone before the check | ${before} KiB |"
            echo "| Clone after the check | ${after} KiB |"
            echo "| Exit status | ${rc} |"
            echo
            echo '```'
            cat "${RUNNER_TEMP}/ahead-check.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            # One annotation per finding, so the red run names the rows.
            grep '^aheadcheck: ' "${RUNNER_TEMP}/ahead-check.log" | sed 's/^/::error::/' || true
          fi
          exit "$rc"
