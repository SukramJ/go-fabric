# go-fabric's certification harness image (internal/chiptool/image): the
# pinned matter.js CHIP image (the Makefile's CHIP_BASE_IMAGE) with chip's
# jf-admin-app, jf-control-app and Push AV server added, built from the
# Makefile's CHIP_TEST_IMAGE_COMMIT and pushed as
# ghcr.io/sukramj/go-fabric-chip:<that commit>.
#
# Manual only. After a run the digest the run's summary prints goes into
# the Makefile's CHIP_TEST_IMAGE (phase 34): the suite then runs in this
# image, which carries everything matter.js's does.
name: chip-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build and push the harness image
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The CHIP source, its bootstrap and two app builds need more than
      # the runner's free disk: drop the toolchains this job does not use.
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: build and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          commit=$(sed -n 's/^CHIP_TEST_IMAGE_COMMIT[[:space:]]*?=[[:space:]]*//p' Makefile)
          base=$(sed -n 's/^CHIP_BASE_IMAGE[[:space:]]*?=[[:space:]]*//p' Makefile)
          case "$base" in ghcr.io/matter-js/chip@*) ;; *) echo "::error::CHIP_BASE_IMAGE ($base) is not matter.js's image pinned by digest"; exit 1 ;; esac
          tag="ghcr.io/sukramj/go-fabric-chip:$commit"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --use --name chip
          docker buildx build --platform linux/amd64 --push \
            --build-arg CHIP_TEST_IMAGE="$base" --build-arg CHIP_COMMIT="$commit" \
            -t "$tag" internal/chiptool/image
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
          {
            echo "### go-fabric CHIP harness image"
            echo
            echo "Pushed \`$tag\`. Pin it in the Makefile:"
            echo
            echo '```'
            echo "CHIP_TEST_IMAGE        ?= ghcr.io/sukramj/go-fabric-chip@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
