# The virtual OTBR of ADR 0027 decision 7: an otbr-agent with its REST API
# on OpenThread's simulation RCP, built as connectedhomeip's CI builds it
# (.github/workflows/tests.yaml:327-359 at 6170af84), and thread/otbr's live
# test (TestLiveOTBR) against it: the probe, an activation of chip's test
# dataset that attaches, the diagnostics, the revert.
#
# Manual and weekly, like ble-virtual.yml (the weekly run since W6-test-12;
# a scheduled run builds ot-br-posix main): the build takes long and is
# unverified until a dispatched run has passed (ADR 0027: "that the simulation RCP runs
# on the ubuntu-24.04 runner"). The steps are script/otbr-virtual-test.sh,
# the same as `make otbr-virtual-test` locally.
#
# thread-families runs the certification families of the thread group
# (TBRM, DGTHREAD, THNETDIR; .github/workflows/chiptool.yml's `groups`
# names them and never runs them itself) against the reference daemon's
# --otbr endpoint on a second agent (OTBR_SERVE=1). It is armed by the
# repository variable OTBR_THREAD_FAMILIES=armed, which the owner sets
# after the first green otbr-virtual run (phase 34, owner decision
# 2026-11-04); an agent that does not come up is the ENVIRONMENT (the
# script's exit 2), reported as a warning and no defect.
name: otbr-virtual

on:
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:
    inputs:
      otbr_ref:
        description: ot-br-posix ref to build
        required: false
        default: main

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  GO_VERSION: "1.27.4"

jobs:
  otbr-virtual:
    name: OTBR REST on the simulation RCP (TestLiveOTBR)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build the agent and the RCP, run the live test
        env:
          OTBR_REF: ${{ inputs.otbr_ref || 'main' }}
          OTBR_LOG_DIR: ${{ runner.temp }}/otbr-virtual-logs
        run: make otbr-virtual-test
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otbr-virtual-logs
          path: ${{ runner.temp }}/otbr-virtual-logs
          if-no-files-found: ignore

  thread-families:
    name: certification families (thread)
    needs: otbr-virtual
    if: vars.OTBR_THREAD_FAMILIES == 'armed'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: start avahi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends avahi-daemon
          sudo sed -i 's/^#\?deny-interfaces=.*$/deny-interfaces=docker0/' /etc/avahi/avahi-daemon.conf
          sudo systemctl restart avahi-daemon
          systemctl is-active dbus avahi-daemon
      - name: pull the pinned CHIP image
        run: make chiptool-image
      - name: build and start the virtual OTBR agent
        id: otbr
        continue-on-error: true
        env:
          OTBR_REF: ${{ inputs.otbr_ref || 'main' }}
          OTBR_LOG_DIR: ${{ runner.temp }}/otbr-thread-logs
          OTBR_SERVE: "1"
        run: script/otbr-virtual-test.sh
      - name: the environment
        if: steps.otbr.outcome != 'success'
        run: echo "::warning::the virtual OTBR agent did not come up (ENVIRONMENT, script/otbr-virtual-test.sh exit 2); the thread families did not run, which is no defect"
      - name: families
        if: steps.otbr.outcome == 'success'
        env:
          GOFABRIC_CHIP_FAMILIES: TBRM,DGTHREAD,THNETDIR
          GOFABRIC_CHIP_HARNESS: image
        run: |
          set -o pipefail
          make chiptool-families 2>&1 | tee /tmp/families.log
          if grep -q -- "--- SKIP: TestChipCertificationFamilies " /tmp/families.log; then
            echo "::error::the certification families skipped themselves; the harness was not usable"
            exit 1
          fi
      - name: upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otbr-thread-families
          path: |
            ${{ runner.temp }}/otbr-thread-logs
            /tmp/families.log
            bin/chip-harness/logs
          if-no-files-found: ignore
