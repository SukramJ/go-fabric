version: 2
updates:
  # The module's own Go dependencies. Five direct requires (filippo.io/nistec,
  # github.com/miekg/dns, golang.org/x/net, golang.org/x/tools,
  # modernc.org/sqlite) plus their transitive set and the apidiff tool's
  # module — see go.mod.
  #
  # Two of them are load-bearing for the licence position recorded in
  # THIRD-PARTY-NOTICES.md, so a major bump gets its own PR rather than
  # riding along in a group: a dependency that relicenses is a decision, not
  # a version number.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # The nested modules (ble/bluez, ble/esphome, wifi/wpasupplicant, and the
  # example module examples/ble-wifi-light): their own third-party
  # requires (godbus, flynn/noise, miekg/dns). Their require of go-fabric
  # itself is set by the release (the nested module is tagged with the
  # release that ships it), so Dependabot leaves it alone. Their indirect
  # requires of the root module's dependencies (modernc.org/sqlite and its
  # transitive set) follow the root through the replace directive, which
  # Dependabot does not see: a root-module bump runs `go mod tidy` in both
  # nested modules on the same PR, or they fail on
  # `go mod tidy -diff` (#350).
  - package-ecosystem: gomod
    directory: "/ble/bluez"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/SukramJ/go-fabric"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: "/wifi/wpasupplicant"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/SukramJ/go-fabric"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  # The example composes the in-repo modules through replace directives;
  # its third-party requires follow them.
  - package-ecosystem: gomod
    directory: "/examples/ble-wifi-light"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/SukramJ/go-fabric"
      - dependency-name: "github.com/SukramJ/go-fabric/ble/bluez"
      - dependency-name: "github.com/SukramJ/go-fabric/wifi/wpasupplicant"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: "/ble/esphome"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/SukramJ/go-fabric"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions (pinned by commit SHA; Dependabot bumps the SHA and
  # keeps the `# vX` version comment in sync).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    # Minor and patch bumps in one group; a major bump comes as a pull
    # request of its own, which the auto-merge workflow does not queue
    # (review II, R2-P5-sup-08).
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The certification harness image's build inputs
  # (internal/chiptool/image/Dockerfile): the ubuntu base its CHIP build
  # stages start from, pinned by digest (R2-P5-sup-07). Dependabot proposes
  # a new digest of the same tag; a new Ubuntu release is matter.js's
  # Dockerfile's decision first, so version updates are ignored. A merged
  # bump changes nothing until the image is rebuilt (chip-image.yml) and
  # its digest pinned in the Makefile — deliberately, like every image bump.
  - package-ecosystem: docker
    directory: "/internal/chiptool/image"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    ignore:
      - dependency-name: "ubuntu"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The documentation site's build (docs/requirements.in and its hashed
  # pip-compile lock docs/requirements.txt, pages.yml). Its header asks for
  # versions released at least two weeks before they are pinned: the
  # cooldown.
  - package-ecosystem: pip
    directory: "/docs"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "docs(deps)"

  # script/ble-virtual (package.json, package-lock.json), the ble-virtual
  # leg's matter.js peripheral and controller. Its four direct requires are
  # one matter.js prerelease build, pinned deliberately and moved by hand:
  # ignored here. What Dependabot proposes is the lockfile's transitive
  # set, in one grouped pull request (R2-P5-sup-07).
  - package-ecosystem: npm
    directory: "/script/ble-virtual"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "@matter/*"
      - dependency-name: "@project-chip/*"
    groups:
      ble-virtual:
        patterns: ["*"]
