version: 2
updates:
  # The module's own Go dependencies. Five direct requires (filippo.io/nistec,
  # github.com/grandcat/zeroconf, github.com/miekg/dns, golang.org/x/net,
  # modernc.org/sqlite) plus their transitive set — see go.mod.
  #
  # Two of them are load-bearing for the licence position recorded in
  # THIRD-PARTY-NOTICES.md, so a major bump gets its own PR rather than
  # riding along in a group: a dependency that relicenses is a decision, not
  # a version number.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # The nested modules (ble/bluez, ble/esphome): their own third-party
  # requires (godbus, flynn/noise, miekg/dns). Their require of go-fabric
  # itself is set by the release (the nested module is tagged with the
  # release that ships it), so Dependabot leaves it alone. Their indirect
  # requires of the root module's dependencies (modernc.org/sqlite and its
  # transitive set) follow the root through the replace directive, which
  # Dependabot does not see: a root-module bump runs `go mod tidy` in both
  # nested modules on the same PR, or ble/bluez and ble/esphome fail on
  # `go mod tidy -diff` (#350).
  - package-ecosystem: gomod
    directory: "/ble/bluez"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/SukramJ/go-fabric"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: "/ble/esphome"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/SukramJ/go-fabric"
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions (pinned by commit SHA; Dependabot bumps the SHA and
  # keeps the `# vX` version comment in sync).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
