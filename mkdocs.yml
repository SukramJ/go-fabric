# The documentation site, published to GitHub Pages by
# .github/workflows/pages.yml. Build it locally with
#   pip install -r docs/requirements.txt && mkdocs build --strict
# strict turns every warning (a broken link, a missing nav target, a
# snippet path that does not exist) into a failed build.
site_name: go-fabric
site_description: Matter as an embeddable Go library — the device side and the controller role, a semantic port of matter.js.
site_url: https://sukramj.github.io/go-fabric/
repo_url: https://github.com/SukramJ/go-fabric
repo_name: SukramJ/go-fabric
edit_uri: edit/main/docs/
copyright: Apache License 2.0

docs_dir: docs
strict: true
# A link to a missing heading fails the build as a missing page does.
validation:
  links:
    anchors: warn

# history/ holds the finished planning records; the active concept is a
# German working paper. Neither is published.
exclude_docs: |
  history/
  concept-v6-*.md
  concept-v7-*.md
  concept-v8-*.md
  concept-v9-*.md
  concept-v10-*.md
  requirements.txt

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

# Links from a page to files outside docs/ (CLAUDE.md, notes/, the Go
# packages) become GitHub links; a target that does not exist stays a
# broken link and fails the strict build.
hooks:
  - script/mkdocs/repo_links.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - The device side: getting-started/device.md
      - "A host's view": guides/host-view.md
      - Embed in a daemon: guides/embed-in-a-daemon.md
      - The controller side: getting-started/controller.md
  - Architecture: architecture.md
  - Roadmap: roadmap.md
  - Guides:
      - Host ports: guides/ports.md
      - Thermostat: guides/thermostat.md
      - BLE through ESPHome proxies: guides/ble-proxies.md
      - Advanced seams: guides/advanced-seams.md
      - Migrating to the facade: guides/migrating-to-the-facade.md
      - Concurrency: guides/concurrency.md
      - Persistence: guides/persistence.md
      - Observability: guides/observability.md
      - Intermittently connected devices: guides/icd.md
      - Limits: guides/limits.md
      - Operations: guides/operations.md
      - Testing in process: guides/testing-in-process.md
      - Security: security.md
